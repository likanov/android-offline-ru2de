appId: com.personal.germanvocabulary
name: answer-wrong
---
[
  {
    "runFlow": {
      "when": {
        "visible": {
          "id": "training-result"
        }
      },
      "commands": [
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Продолжить"
            }
          }
        },
        {
          "tapOn": "Продолжить"
        }
      ]
    }
  },
  {
    "copyTextFrom": {
      "id": "training-prompt-.*"
    }
  },
  {
    "runScript": {
      "file": "answer-label.js"
    }
  },
  {
    "runFlow": {
      "when": {
        "visible": {
          "id": "training-prompt-ru-de"
        }
      },
      "commands": [
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "das Bild"
            }
          }
        },
        {
          "tapOn": "das Bild"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "visible": {
          "id": "training-prompt-de-ru"
        }
      },
      "commands": [
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "картина"
            }
          }
        },
        {
          "tapOn": "картина"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "visible": {
          "id": "training-prompt-typing"
        }
      },
      "commands": [
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Ответ на немецком"
            }
          }
        },
        {
          "tapOn": "Ответ на немецком"
        },
        {
          "inputText": "wrong"
        },
        {
          "hideKeyboard": {}
        },
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Проверить"
            }
          }
        },
        {
          "tapOn": "Проверить"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "visible": {
          "id": "training-prompt-definite-article"
        }
      },
      "commands": [
        {
          "assertNotVisible": {
            "id": "training-gender-hint"
          }
        },
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "die"
            }
          }
        },
        {
          "tapOn": "die"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "visible": {
          "id": "training-prompt-indefinite-article"
        }
      },
      "commands": [
        {
          "assertNotVisible": {
            "id": "training-gender-hint"
          }
        },
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "eine"
            }
          }
        },
        {
          "tapOn": "eine"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "visible": {
          "id": "training-prompt-listening"
        }
      },
      "commands": [
        {
          "assertNotVisible": {
            "id": "training-gender-hint"
          }
        },
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Прослушать"
            }
          }
        },
        {
          "tapOn": "Прослушать"
        },
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Ответ на немецком"
            }
          }
        },
        {
          "tapOn": "Ответ на немецком"
        },
        {
          "inputText": "wrong"
        },
        {
          "hideKeyboard": {}
        },
        {
          "runFlow": {
            "file": "ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Проверить"
            }
          }
        },
        {
          "tapOn": "Проверить"
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-result",
          "text": "Ошибка.*"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-result",
          "text": "Ошибка.*"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "training-result",
      "text": "Ошибка.*"
    }
  }
]
