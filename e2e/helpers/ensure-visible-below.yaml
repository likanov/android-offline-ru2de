appId: com.personal.germanvocabulary
name: ensure-visible-below
---
[
  {
    "repeat": {
      "while": {
        "notVisible": "${TARGET_TEXT}"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "${TARGET_TEXT}"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": "${TARGET_TEXT}"
  }
]
