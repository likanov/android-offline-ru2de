appId: com.personal.germanvocabulary
name: open-navigation
---
[
  {
    "runFlow": {
      "when": {
        "visible": {
          "id": "more-menu"
        }
      },
      "commands": [
        {
          "tapOn": {
            "id": "menu-close"
          }
        },
        {
          "extendedWaitUntil": {
            "visible": {
              "id": "nav-more"
            },
            "timeout": 5000
          }
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        },
        {
          "extendedWaitUntil": {
            "visible": {
              "id": "nav-more"
            },
            "timeout": 5000
          }
        }
      ]
    }
  },
  {
    "extendedWaitUntil": {
      "visible": {
        "id": "nav-more"
      },
      "timeout": 5000
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "${NAV_TARGET}"
        }
      },
      "commands": [
        {
          "tapOn": {
            "id": "nav-today"
          }
        },
        {
          "tapOn": {
            "id": "nav-more"
          }
        },
        {
          "repeat": {
            "while": {
              "notVisible": {
                "id": "${NAV_TARGET}"
              }
            },
            "times": 6,
            "commands": [
              {
                "swipe": {
                  "from": {
                    "id": "more-menu-scroll"
                  },
                  "direction": "UP",
                  "duration": 400
                }
              }
            ]
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "${NAV_TARGET}"
    }
  }
]
