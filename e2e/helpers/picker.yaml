appId: com.personal.germanvocabulary
name: picker
---
[
  {
    "tapOn": {
      "id": "com.google.android.documentsui:id/option_menu_search",
      "optional": true
    }
  },
  {
    "inputText": "${FILE}"
  },
  {
    "hideKeyboard": {}
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "android:id/title",
          "text": "${FILE}"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "com.google.android.documentsui:id/dir_list"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "android:id/title",
          "text": "${FILE}"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "com.google.android.documentsui:id/dir_list"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "android:id/title",
      "text": "${FILE}"
    }
  },
  {
    "tapOn": {
      "id": "android:id/title",
      "text": "${FILE}"
    }
  },
  {
    "tapOn": {
      "text": "Select",
      "optional": true
    }
  }
]
