appId: com.personal.germanvocabulary
name: export-state
---
[
  {
    "runFlow": {
      "file": "open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-transfer"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-transfer"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "backup-save"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "backup-save"
    }
  },
  {
    "tapOn": {
      "id": "backup-save"
    }
  },
  {
    "tapOn": {
      "text": "Show roots",
      "optional": true
    }
  },
  {
    "tapOn": {
      "text": "Downloads",
      "optional": true
    }
  },
  {
    "tapOn": {
      "text": "GermanVocabulary",
      "optional": true
    }
  },
  {
    "tapOn": {
      "id": "android:id/title",
      "text": "german-vocabulary-.*\\.json"
    }
  },
  {
    "eraseText": 100
  },
  {
    "inputText": "${EXPORT_NAME}"
  },
  {
    "hideKeyboard": {}
  },
  {
    "tapOn": "SAVE"
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Резервная копия сохранена"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Резервная копия сохранена"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": "Резервная копия сохранена"
  },
  {
    "takeScreenshot": "export-state-saved"
  }
]
