appId: com.personal.germanvocabulary
name: open-grammar-training
---
[
  {
    "runFlow": {
      "file": "select-profile.yaml",
      "env": {
        "PROFILE": "${PROFILE}"
      }
    }
  },
  {
    "runFlow": {
      "file": "open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-training"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-training"
    }
  },
  {
    "extendedWaitUntil": {
      "visible": {
        "id": "${GRAMMAR_START_ID}"
      },
      "timeout": 5000
    }
  },
  {
    "tapOn": {
      "id": "${GRAMMAR_START_ID}"
    }
  },
  {
    "extendedWaitUntil": {
      "visible": {
        "id": "grammar-prompt"
      },
      "timeout": 5000
    }
  }
]
