appId: com.personal.germanvocabulary
name: transfer.json-roundtrip
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия UI"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/export-state.yaml"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Выбрать резервную копию"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Выбрать резервную копию"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Выбрать резервную копию"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": "Выбрать резервную копию"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Выбрать резервную копию"
      }
    }
  },
  {
    "tapOn": "Выбрать резервную копию"
  },
  {
    "runFlow": {
      "file": "../helpers/picker.yaml",
      "env": {
        "FILE": "${EXPORT_NAME}"
      }
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Восстановить новые профили"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Восстановить новые профили"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Восстановить новые профили"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": "Восстановить новые профили"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Восстановить новые профили"
      }
    }
  },
  {
    "tapOn": "Восстановить новые профили"
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Восстановлено профилей:.*"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Восстановлено профилей:.*"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": "Восстановлено профилей:.*"
  },
  {
    "runFlow": {
      "file": "../helpers/export-state.yaml",
      "env": {
        "EXPORT_NAME": "${RESTORE_CHECKPOINT_NAME}"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия — продолжение восстановлено 2"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-topics"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-topics"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Выбрать набор: Регрессия"
      }
    }
  },
  {
    "tapOn": "Выбрать набор: Регрессия"
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Изучать набор"
      }
    }
  },
  {
    "tapOn": "Изучать набор"
  },
  {
    "runFlow": {
      "file": "../helpers/answer-double.yaml",
      "env": {
        "WORD_DE": "Prüfstuhl",
        "WORD_RU": "контрольный стул"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Верно! \\+10 XP"
      }
    }
  },
  {
    "assertVisible": {
      "text": "Верно! \\+10 XP"
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "nav-dictionary"
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-vocabulary-training.yaml"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Верно! \\+10 XP"
      }
    }
  },
  {
    "assertVisible": {
      "text": "Верно! \\+10 XP"
    }
  }
]
