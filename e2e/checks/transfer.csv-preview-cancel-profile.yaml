appId: com.personal.germanvocabulary
name: transfer.csv-preview-cancel-profile
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия UI"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-transfer"
    }
  },
  {
    "tapOn": "Выбрать CSV"
  },
  {
    "runFlow": {
      "file": "../helpers/picker.yaml",
      "env": {
        "FILE": "vocabulary.csv"
      }
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Новые: 0 · Дубли: 3 · Ошибки: 1"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Новые: 0 · Дубли: 3 · Ошибки: 1"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": "Новые: 0 · Дубли: 3 · Ошибки: 1"
  },
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Второй переименован"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-transfer"
    }
  },
  {
    "assertNotVisible": "Импортировать"
  },
  {
    "tapOn": "Выбрать CSV"
  },
  {
    "back": {}
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Выбрать CSV"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Выбрать CSV"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": "Выбрать CSV"
  }
]
