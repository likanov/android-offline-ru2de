appId: com.personal.germanvocabulary
name: grammar-rules.nine-error-reset
---
[
  {
    "launchApp": {
      "stopApp": false
    }
  },
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Rules — error"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-training"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-training"
    }
  },
  {
    "tapOn": {
      "id": "training-grammar-start"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-prompt"
    }
  },
  {
    "tapOn": {
      "id": "grammar-answer-input"
    }
  },
  {
    "inputText": "falsch"
  },
  {
    "tapOn": {
      "id": "grammar-submit"
    }
  },
  {
    "assertVisible": "Ошибка. Повторите правило."
  },
  {
    "assertVisible": "Серия: 0/10"
  },
  {
    "takeScreenshot": "${CHECK_ID}"
  }
]
