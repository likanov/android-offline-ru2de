              "WORD_RU": "стул"
            }
          }
        },
        {
          "runFlow": {
            "file": "../helpers/ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Продолжить"
            }
          }
        },
        {
          "tapOn": "Продолжить"
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
