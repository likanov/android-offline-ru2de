    "repeat": {
      "while": {
        "notVisible": {
          "text": "Изучать набор"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
