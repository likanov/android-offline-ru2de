              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": "Выбрать набор: 20 UI"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Выбрать набор: 20 UI"
      }
    }
  },
  {
    "tapOn": "Выбрать набор: 20 UI"
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Изучать набор"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
