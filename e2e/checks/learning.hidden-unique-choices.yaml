appId: com.personal.germanvocabulary
name: learning.hidden-unique-choices
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия — 20 UI"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-topics"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-topics"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Выбрать набор: 20 UI"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Выбрать набор: 20 UI"
        }
      },
      "times": 18,
