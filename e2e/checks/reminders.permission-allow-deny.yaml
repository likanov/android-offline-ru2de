appId: com.personal.germanvocabulary
name: reminders.permission-allow-deny
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия UI"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-reminders"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-reminders"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Ежедневное напоминание"
      }
    }
  },
  {
    "tapOn": "Ежедневное напоминание"
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Сохранить напоминание"
      }
    }
  },
  {
    "tapOn": "Сохранить напоминание"
  },
  {
    "tapOn": {
      "text": "Don’t allow|Don't allow",
      "optional": true
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Разрешите уведомления в настройках Android. Время сохранено."
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Разрешите уведомления в настройках Android. Время сохранено."
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": "Разрешите уведомления в настройках Android. Время сохранено."
  }
]
