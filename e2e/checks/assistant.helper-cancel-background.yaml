appId: com.personal.germanvocabulary
name: assistant.helper-cancel-background
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия UI"
      }
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "nav-dictionary"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Поиск слов"
      }
    }
  },
  {
    "tapOn": "Поиск слов"
  },
  {
    "eraseText": 100
  },
  {
    "inputText": "Stuhl"
  },
  {
    "hideKeyboard": {}
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Stuhl — стул"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Stuhl — стул"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Stuhl — стул"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": ".*Stuhl — стул"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": ".*Stuhl — стул"
      }
    }
  },
  {
    "tapOn": ".*Stuhl — стул"
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Помоги запомнить"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Помоги запомнить"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Помоги запомнить"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": "Помоги запомнить"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Помоги запомнить"
      }
    }
  },
  {
    "tapOn": "Помоги запомнить"
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Короткий текст"
      }
    }
  },
  {
    "tapOn": "Короткий текст"
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Создать подсказку"
      }
    }
  },
  {
    "tapOn": "Создать подсказку"
  },
  {
    "swipe": {
      "from": {
        "id": "screen-scroll"
      },
      "direction": "UP",
      "duration": 300
    }
  },
  {
    "extendedWaitUntil": {
      "visible": "Отменить",
      "timeout": 15000
    }
  },
  {
    "tapOn": "Отменить"
  },
  {
    "extendedWaitUntil": {
      "visible": "Генерация отменена",
      "timeout": 60000
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Создать подсказку"
      }
    }
  },
  {
    "tapOn": "Создать подсказку"
  },
  {
    "pressKey": "HOME"
  },
  {
    "launchApp": {
      "stopApp": false
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "nav-dictionary"
    }
  }
]
