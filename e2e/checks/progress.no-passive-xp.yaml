        "notVisible": {
          "text": "Помоги запомнить"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": "Помоги запомнить"
