    "tapOn": "Правило"
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-progress"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-progress"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "XP: 250"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
