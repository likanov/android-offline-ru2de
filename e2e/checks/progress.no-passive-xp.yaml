appId: com.personal.germanvocabulary
name: progress.no-passive-xp
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия — изучено"
      }
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "nav-dictionary"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Поиск слов"
      }
    }
  },
  {
    "tapOn": "Поиск слов"
  },
  {
    "eraseText": 100
  },
  {
    "inputText": "Stuhl"
  },
  {
    "hideKeyboard": {}
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Stuhl — стул"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Stuhl — стул"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Stuhl — стул"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": ".*Stuhl — стул"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": ".*Stuhl — стул"
      }
    }
  },
  {
    "tapOn": ".*Stuhl — стул"
  },
  {
    "runFlow": {
