        "TARGET_TEXT": "Прослушать"
      }
    }
  },
  {
    "tapOn": "Прослушать"
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Остановить звук"
      }
    }
  },
  {
    "tapOn": "Остановить звук"
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Помоги запомнить"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": "Помоги запомнить"
