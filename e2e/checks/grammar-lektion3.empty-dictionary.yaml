appId: com.personal.germanvocabulary
name: grammar-lektion3.empty-dictionary
---
[
  {
    "launchApp": {
      "stopApp": false
    }
  },
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "L3 — empty"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-training"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-training"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-lektion3-toggle"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 300
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "training-lektion3-toggle"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-lektion3-noun-plural"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 300
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "training-lektion3-noun-plural"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-prompt"
    }
  },
  {
    "tapOn": {
      "id": "grammar-answer-input"
    }
  },
  {
    "inputText": "${ANSWER_L3_EMPTY}"
  },
  {
    "tapOn": {
      "id": "grammar-submit"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-result"
    }
  },
  {
    "assertVisible": "Верно! \\+(10|60) XP"
  },
  {
    "takeScreenshot": "${CHECK_ID}"
  }
]
