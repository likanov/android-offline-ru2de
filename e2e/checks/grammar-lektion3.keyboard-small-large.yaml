appId: com.personal.germanvocabulary
name: grammar-lektion3.keyboard-small-large
---
[
  {
    "runFlow": {
      "when": {
        "true": "${UI_STAGE === 'keyboard-closed'}"
      },
      "commands": [
        {
          "runFlow": {
            "file": "../helpers/open-lektion3-lesson.yaml",
            "env": {
              "PROFILE": "${KEYBOARD_PROFILE}",
              "LEKTION3_KIND": "noun-plural"
            }
          }
        },
        {
          "assertVisible": {
            "id": "grammar-answer-input"
          }
        },
        {
          "assertVisible": {
            "id": "grammar-submit"
          }
        },
        {
          "takeScreenshot": "${CHECK_ID}-keyboard-closed"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "true": "${UI_STAGE === 'keyboard-open'}"
      },
      "commands": [
        {
          "tapOn": {
            "id": "grammar-answer-input"
          }
        },
        {
          "inputText": "${KEYBOARD_ANSWER}"
        },
        {
          "assertVisible": {
            "id": "grammar-answer-input"
          }
        },
        {
          "assertVisible": {
            "id": "grammar-submit"
          }
        },
        {
          "takeScreenshot": "${CHECK_ID}-keyboard-open"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "true": "${UI_STAGE === 'after-submit'}"
      },
      "commands": [
        {
          "tapOn": {
            "id": "grammar-submit"
          }
        },
        {
          "assertVisible": {
            "id": "grammar-result"
          }
        },
        {
          "assertVisible": "Верно! \\+10 XP"
        },
        {
          "runFlow": {
            "file": "../helpers/ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Продолжить"
            }
          }
        },
        {
          "assertVisible": {
            "id": "grammar-next"
          }
        },
        {
          "takeScreenshot": "${CHECK_ID}-after-submit"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "true": "${UI_STAGE === 'multi-before'}"
      },
      "commands": [
        {
          "runFlow": {
            "file": "../helpers/open-lektion3-lesson.yaml",
            "env": {
              "PROFILE": "L3 — keyboard-multi",
              "LEKTION3_KIND": "plural-invariant"
            }
          }
        },
        {
          "assertVisible": {
            "id": "grammar-multi-option-${MULTI_FIRST_L3_KEYBOARD_MULTI}"
          }
        },
        {
          "takeScreenshot": "${CHECK_ID}-multi-before"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "true": "${UI_STAGE === 'multi-after'}"
      },
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "grammar-multi-option-${MULTI_FIRST_L3_KEYBOARD_MULTI}"
            },
            "direction": "UP",
            "duration": 400
          }
        },
        {
          "runFlow": {
            "file": "../helpers/ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Проверить"
            }
          }
        },
        {
          "assertVisible": {
            "id": "grammar-multi-option-${MULTI_LAST_L3_KEYBOARD_MULTI}"
          }
        },
        {
          "tapOn": {
            "id": "grammar-multi-option-${MULTI_LAST_L3_KEYBOARD_MULTI}"
          }
        },
        {
          "assertVisible": {
            "id": "grammar-multi-submit"
          }
        },
        {
          "takeScreenshot": "${CHECK_ID}-multi-after"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "true": "${UI_STAGE === 'complete'}"
      },
      "commands": [
        {
          "assertVisible": {
            "id": "grammar-multi-submit"
          }
        }
      ]
    }
  }
]
