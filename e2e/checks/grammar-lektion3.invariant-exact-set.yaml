appId: com.personal.germanvocabulary
name: grammar-lektion3.invariant-exact-set
---
[
  {
    "launchApp": {
      "stopApp": false
    }
  },
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "L3 — invariant-subset"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-training"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-training"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-lektion3-toggle"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 300
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "training-lektion3-toggle"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-lektion3-plural-invariant"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 300
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "training-lektion3-plural-invariant"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-prompt"
    }
  },
  {
    "tapOn": {
      "id": "grammar-multi-option-${MULTI_L3_INVARIANT_SUBSET_0}"
    }
  },
  {
    "tapOn": {
      "id": "grammar-multi-submit"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-result"
    }
  },
  {
    "assertVisible": "Ошибка. Повторите правило."
  },
  {
    "launchApp": {
      "stopApp": false
    }
  },
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "L3 — invariant-superset"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-training"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-training"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-lektion3-toggle"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 300
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "training-lektion3-toggle"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-lektion3-plural-invariant"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 300
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "training-lektion3-plural-invariant"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-prompt"
    }
  },
  {
    "tapOn": {
      "id": "grammar-multi-option-${MULTI_L3_INVARIANT_SUPERSET_0}"
    }
  },
  {
    "tapOn": {
      "id": "grammar-multi-option-${MULTI_L3_INVARIANT_SUPERSET_1}"
    }
  },
  {
    "tapOn": {
      "id": "grammar-multi-option-${MULTI_L3_INVARIANT_SUPERSET_2}"
    }
  },
  {
    "tapOn": {
      "id": "grammar-multi-submit"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-result"
    }
  },
  {
    "assertVisible": "Ошибка. Повторите правило."
  },
  {
    "takeScreenshot": "${CHECK_ID}"
  }
]
