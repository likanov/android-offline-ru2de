appId: com.personal.germanvocabulary
name: profiles.profile-create-rename
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия UI"
      }
    }
  },
  {
    "assertVisible": {
      "id": "profile-new-name"
    }
  },
  {
    "tapOn": {
      "id": "profile-new-name"
    }
  },
  {
    "eraseText": 100
  },
  {
    "inputText": "Второй UI"
  },
  {
    "hideKeyboard": {}
  },
  {
    "tapOn": {
      "id": "profile-create"
    }
  },
  {
    "assertVisible": "Активный профиль: Второй UI"
  },
  {
    "assertVisible": {
      "id": "profile-rename-второй-ui"
    }
  },
  {
    "tapOn": {
      "id": "profile-rename-второй-ui"
    }
  },
  {
    "assertVisible": {
      "id": "profile-edit-name"
    }
  },
  {
    "tapOn": {
      "id": "profile-edit-name"
    }
  },
  {
    "eraseText": 100
  },
  {
    "inputText": "Второй переименован"
  },
  {
    "hideKeyboard": {}
  },
  {
    "tapOn": {
      "id": "profile-save-name"
    }
  },
  {
    "assertVisible": "Активный профиль: Второй переименован"
  }
]
