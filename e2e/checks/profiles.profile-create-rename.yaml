appId: com.personal.germanvocabulary
name: profiles.profile-create-rename
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия UI"
      }
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-new-name"
        }
      },
      "times": 6,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "profile-new-name"
    }
  },
  {
    "tapOn": {
      "id": "profile-new-name"
    }
  },
  {
    "eraseText": 100
  },
  {
    "tapOn": {
      "id": "profile-new-name"
    }
  },
  {
    "inputText": "Второй UI"
  },
  {
    "hideKeyboard": {}
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-create"
        }
      },
      "times": 6,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "profile-create"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-rename-второй-ui"
        }
      },
      "times": 6,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "profile-rename-второй-ui"
    }
  },
  {
    "tapOn": {
      "id": "profile-rename-второй-ui"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-edit-name"
        }
      },
      "times": 6,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "profile-edit-name"
    }
  },
  {
    "tapOn": {
      "id": "profile-edit-name"
    }
  },
  {
    "eraseText": 100
  },
  {
    "tapOn": {
      "id": "profile-edit-name"
    }
  },
  {
    "inputText": "Второй переименован"
  },
  {
    "hideKeyboard": {}
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-save-name"
        }
      },
      "times": 6,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "profile-save-name"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-rename-второй-переименован"
        }
      },
      "times": 6,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "profile-rename-второй-переименован"
    }
  }
]
