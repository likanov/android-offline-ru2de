appId: com.personal.germanvocabulary
name: first-launch.clean-40-words
---
[
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-profiles"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-profiles"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-new-name"
        }
      },
      "times": 6,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "profile-new-name"
    }
  },
  {
    "tapOn": {
      "id": "profile-new-name"
    }
  },
  {
    "eraseText": 100
  },
  {
    "inputText": "Регрессия UI"
  },
  {
    "hideKeyboard": {}
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-create"
        }
      },
      "times": 6,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "profile-create"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "profile-rename-регрессия-ui"
        }
      },
      "times": 8,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "id": "profile-rename-регрессия-ui"
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "nav-dictionary"
    }
  },
  {
    "extendedWaitUntil": {
      "visible": "Найдено: 40",
      "timeout": 60000
    }
  },
  {
    "assertVisible": {
      "id": "dictionary-count"
    }
  }
]
