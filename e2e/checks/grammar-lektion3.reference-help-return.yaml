appId: com.personal.germanvocabulary
name: grammar-lektion3.reference-help-return
---
[
  {
    "launchApp": {
      "stopApp": false
    }
  },
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "L3 — plural-error"
      }
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-training"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-training"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-lektion3-toggle"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 300
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "training-lektion3-toggle"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "id": "training-lektion3-noun-plural"
        }
      },
      "times": 12,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 300
          }
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "training-lektion3-noun-plural"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-prompt"
    }
  },
  {
    "assertVisible": {
      "id": "grammar-result"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible-below.yaml",
      "env": {
        "TARGET_TEXT": "Объяснить ошибку"
      }
    }
  },
  {
    "tapOn": {
      "id": "grammar-error-open"
    }
  },
  {
    "assertVisible": "Разбор грамматической ошибки"
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible-below.yaml",
      "env": {
        "TARGET_TEXT": "К тренировке"
      }
    }
  },
  {
    "tapOn": "К тренировке"
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible-below.yaml",
      "env": {
        "TARGET_TEXT": "Справочник"
      }
    }
  },
  {
    "tapOn": {
      "id": "grammar-reference-open"
    }
  },
  {
    "assertVisible": "Справочник"
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Назад к заданию"
      }
    }
  },
  {
    "tapOn": "Назад к заданию"
  },
  {
    "assertVisible": {
      "id": "grammar-result"
    }
  },
  {
    "takeScreenshot": "${CHECK_ID}"
  }
]
