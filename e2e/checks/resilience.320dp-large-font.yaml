appId: com.personal.germanvocabulary
name: resilience.320dp-large-font
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия UI"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-dictionary"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Поиск слов"
      }
    }
  },
  {
    "tapOn": "Поиск слов"
  },
  {
    "inputText": "ü"
  },
  {
    "tapOn": {
      "id": "nav-progress"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "XP: 0"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "XP: 0"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": "XP: 0"
  }
]
