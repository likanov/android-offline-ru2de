appId: com.personal.germanvocabulary
name: audio.tts-offline
---
[
  {
    "runFlow": {
      "file": "../helpers/select-profile.yaml",
      "env": {
        "PROFILE": "Регрессия — серия 19"
      }
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "nav-dictionary"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": "Поиск слов"
      }
    }
  },
  {
    "tapOn": "Поиск слов"
  },
  {
    "eraseText": 100
  },
  {
    "inputText": "Prüfstuhl"
  },
  {
    "hideKeyboard": {}
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Prüfstuhl — контрольный стул"
        }
      },
      "times": 35,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Prüfstuhl — контрольный стул"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": {
          "text": ".*Prüfstuhl — контрольный стул"
        }
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": ".*Prüfstuhl — контрольный стул"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/ensure-visible.yaml",
      "env": {
        "TARGET_TEXT": ".*Prüfstuhl — контрольный стул"
      }
    }
  },
  {
    "tapOn": ".*Prüfstuhl — контрольный стул"
  },
  {
    "runFlow": {
      "when": {
        "visible": "Прослушать"
      },
      "commands": [
        {
          "runFlow": {
            "file": "../helpers/ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Прослушать"
            }
          }
        },
        {
          "tapOn": "Прослушать"
        },
        {
          "runFlow": {
            "file": "../helpers/ensure-visible.yaml",
            "env": {
              "TARGET_TEXT": "Остановить звук"
            }
          }
        },
        {
          "tapOn": "Остановить звук"
        }
      ]
    }
  },
  {
    "runFlow": {
      "when": {
        "visible": "Офлайн-озвучка недоступна"
      },
      "commands": [
        {
          "repeat": {
            "while": {
              "notVisible": "Офлайн-озвучка недоступна"
            },
            "times": 18,
            "commands": [
              {
                "swipe": {
                  "from": {
                    "id": "screen-scroll"
                  },
                  "direction": "DOWN",
                  "duration": 400
                }
              }
            ]
          }
        },
        {
          "repeat": {
            "while": {
              "notVisible": "Офлайн-озвучка недоступна"
            },
            "times": 18,
            "commands": [
              {
                "swipe": {
                  "from": {
                    "id": "screen-scroll"
                  },
                  "direction": "UP",
                  "duration": 400
                }
              }
            ]
          }
        },
        {
          "assertVisible": "Офлайн-озвучка недоступна"
        }
      ]
    }
  },
  {
    "assertVisible": "Прослушать|Офлайн-озвучка недоступна"
  }
]
