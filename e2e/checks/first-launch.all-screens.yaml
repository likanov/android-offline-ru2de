appId: com.personal.germanvocabulary
name: first-launch.all-screens
---
[
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-profiles"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-profiles"
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "nav-today"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-progress"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-progress"
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "tapOn": {
      "id": "nav-dictionary"
    }
  },
  {
    "runFlow": {
      "when": {
        "notVisible": {
          "id": "nav-more"
        }
      },
      "commands": [
        {
          "hideKeyboard": {}
        }
      ]
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-vocabulary-training.yaml"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-reviews"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-reviews"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-topics"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-topics"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-difficult"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-difficult"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-reminders"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-reminders"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-transfer"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-transfer"
    }
  },
  {
    "runFlow": {
      "file": "../helpers/open-navigation.yaml",
      "env": {
        "NAV_TARGET": "nav-model"
      }
    }
  },
  {
    "tapOn": {
      "id": "nav-model"
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Локальная модель"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "DOWN",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "repeat": {
      "while": {
        "notVisible": "Локальная модель"
      },
      "times": 18,
      "commands": [
        {
          "swipe": {
            "from": {
              "id": "screen-scroll"
            },
            "direction": "UP",
            "duration": 400
          }
        }
      ]
    }
  },
  {
    "assertVisible": "Локальная модель"
  }
]
